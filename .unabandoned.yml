schema: 1

package: "@unabandoned/path-browserify"

upstream:
  repo: browserify/path-browserify
  reason: "unmaintained upstream — the package sits idle while its dev-dependency tree ages"

summary: >-
  Node's core `path` module reimplemented for the browser and other
  environments without Node's built-in path.

why-forked: >-
  A transitive dependency of browserify-style bundling that went unmaintained
  while its tree aged; forked so Renovate keeps that tree current for the
  consumers that pull it in transitively.

status: active

used-by:
  - consumer: "@unabandoned/browserify"
    purpose: "Path polyfill bundled into browser builds in place of Node's built-in."

tags: [browser, path, node-core-polyfill, browserify]
